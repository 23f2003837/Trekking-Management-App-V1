{% extends 'base.html' %}
{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <h2 class="text-teal-dark">Register</h2>
            <form method="POST">
                <div class="mb-3">
                    <label class="text-teal-dark">Name</label>
                    <input type="text" name="name" class="form-control" required>
                </div>
                
                <div class="mb-3">
                    <label class="text-teal-dark">Email</label>
                    <input type="email" name="email" class="form-control" required>
                </div>
                
                <div class="mb-3">
                    <label class="text-teal-dark">Password</label>
                    <input type="password" name="password" class="form-control" required>
                </div>
                
                <div class="form-check mb-3">
                    <input class="form-check-input" type="checkbox" name="apply_as_staff" id="staff-check">
                    <label class="form-check-label text-teal-dark" for="staff-check">Apply as Trek Guide?</label>
                </div>

                <button type="submit" class="btn bg-teal-dark text-offwhite w-100">Submit</button>

            </form>

            <div class="text-center mt-3">
                <p class="text-teal-dark">Already have an account? <a class="text-teal-dark" href="{{ url_for('main.login') }}">Login</a></p>
            </div>
            
        </div>
    </div>
</div>
{% endblock %}
