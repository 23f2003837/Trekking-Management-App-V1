{% extends 'base.html' %}
{% block content %}
<h2 class="text-teal-dark">Register</h2>
<form method="POST">
    
    <div>
        <label>Name</label>
        <input type="text" name="name" class="form-control" required>
    </div>
    
    <div>
        <label>Email</label>
        <input type="email" name="email" class="form-control" required>
    </div>
    
    <div>
        <label>Password</label>
        <input type="password" name="password" class="form-control" required>
    </div>
    
    <button type="submit" class="bg-teal-muted">Submit</button>
</form>
{% endblock %}
