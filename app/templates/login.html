{% extends 'base.html' %}]
{% block content %}
<h2 class="text-teal-dark">Login</h2>
<form method="POST">
    
    <div>
        <label>Email</label>
        <input type="email" name="email" class="form-control" required>
    </div>
    
    <div>
        <label>Password</label>
        <input type="password" name="password" class="form-control" required> 
    </div>
    
    <button type="submit" class="text-teal-muted">Submit</button>
</form>
{% endblock %}
