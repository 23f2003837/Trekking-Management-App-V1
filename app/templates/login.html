{% extends 'base.html' %}]
{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <h2 class="text-teal-dark">Login</h2>
            <form method="POST">

                <div class="mb-3">
                    <label class="text-teal-dark">Email</label>
                    <input type="email" name="email" class="form-control" required>
                </div>
    
                <div class="mb-3">
                    <label class="text-teal-dark">Password</label>
                    <input type="password" name="password" class="form-control" required> 
                </div>
    
                <button type="submit" class="btn w-100 text-offwhite bg-teal-dark">Submit</button>
            </form>
            
            <div class="text-center mt-3">
                <p class="text-teal-dark">Donot have an account? <a class="text-teal-dark" href="{{ url_for('main.register') }}">Register</a></p>
            </div>
        
        </div>
    </div>
</div>
{% endblock %}
