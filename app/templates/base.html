<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}TrekManager{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .bg-teal-dark { background-color: #388087 !important; }
        .text-teal-dark { color: #388087 !important; }

        .bg-teal-muted { background-color: #6FB3B8 !important; }
        .text-teal-muted { color: #6FB3B8 !important; }

        .bg-ice { background-color: #BADFE7 !important; }
        .text-ice { color: #BADFE7 !important; }

        .bg-sage { background-color: #C2EDCE !important; }
        .text-sage { color: #C2EDCE !important; }

        .bg-offwhite { background-color: #F6F6F2 !important; }
        .text-offwhite { color: #F6F6F2 !important; }
        html, body {
            height: 100%;
        }
        body {
            display: flex;
            flex-direction: column;
            margin: 0;
        }
        .container.mt-4 {
            flex: 1;
        }
        footer {
            margin-top: auto;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-dark bg-teal-dark px-3">
        <a class="navbar-brand text-offwhite" href="/">TrekManager</a>
    </nav>
    
    <div class="container mt-4">
        {% with messages = get_flashed_messages() %}
            {% if messages %}
                {% for message in messages %}
                    <div class="alert bg-ice mt-3">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}
        
        {% block content %}
        {% endblock %}
    </div>
    <footer class="bg-teal-dark text-offwhite text-center py-0.40">
      <p>IIT MADRAS BS DATA SCIENCE, MAD1 PROJECT</p>
    </footer>
</body>

</html>
