{% extends 'base.html' %}
{% block content %}
<!-- Welcome Header -->
<div class="mb-4">
    <h3 class="text-teal-dark m-0">Hello, Guide</h3>
    <p class="text-teal-muted mb-0">Welcome back to TrekManager. Here's what's happening today.</p>
</div>
<!-- guide stats -->
<div class="row">
    <div class="col-md-3">
        <div class="card text-center">
            <div class="card-body bg-sage rounded">
                <h5 class="card-title text-teal-dark">Total Assigned Treks</h5>
                <p class="card-text fs-3 text-teal-dark">{{ total_assigned_treks }}</p>
            </div>
        </div>
    </div>

    <div class="col-md-3">
        <div class="card text-center">
            <div class="card-body bg-sage rounded">
                <h5 class="card-title text-teal-dark">Active Treks</h5>
                <p class="card-text fs-3 text-teal-dark">{{ active_treks }}</p>
            </div>
        </div>
    </div>

    <div class="col-md-3">
        <div class="card text-center">
            <div class="card-body bg-sage rounded">
                <h5 class="card-title text-teal-dark">Completed Treks</h5>
                <p class="card-text fs-3 text-teal-dark">{{ completed_treks }}</p>
            </div>
        </div>
    </div>

</div>
{% endblock %}
