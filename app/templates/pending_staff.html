{% extends 'base.html' %}
{% block content %}
<div class="d-flex justify-content-between align-items-center p-3">
    <h5 class="text-teal-dark m-0">Pending Staff Approvals</h5>
    <div>
        <a class="text-teal-muted me-3" href="{{ url_for('main.all_staffs') }}">← View All Staff</a>  
        <a class="text-teal-muted" href="{{ url_for('main.admin_dashboard') }}">← Back to Dashboard</a>
    </div>
</div>

<form method="GET" class="mb-3">
    <input type="text" name="search" placeholder="Search by User name.." class="form-control text-teal-muted bg-offwhite" value="{{ request.args.get('search','') }}">
</form>
<table class="table table-hover">
    <thead>
        <tr>
            <th class="text-teal-dark">Staff Id</th>
            <th class="text-teal-dark">Staff Name</th>
            <th class="text-teal-dark">Email</th>
            <th class="text-teal-dark">Approve</th>
            <th class="text-teal-dark">Reject</th>
        </tr>
    </thead>
    <tbody>
        {% for user in pending_staff_list %}
        <tr>
            <td class="text-teal-dark">{{ user.id }}</td>
            <td class="text-teal-dark">{{ user.name }}</td>
            <td class="text-teal-dark">{{ user.email }}</td>
            <td class="text-teal-dark">
                <form action="{{ url_for("main.approve_staff",user_id=user.id) }}" 
                    method="POST" 
                    style="display:inline;"
                    onsubmit="return confirm('Are you sure you want to approve this staff?');">
                    <button type="submit" class="btn btn-link text-success p-0 m-0" style="text-decoration:none;">✔️</button>
                </form>
            </td>
            <td class="text-teal-dark">
                <form action="{{ url_for("main.reject_staff",user_id=user.id) }}" 
                    method="POST" 
                    style="display:inline;"
                    onsubmit="return confirm('Are you sure you want to reject this staff?');">
                    <button type="submit" class="btn btn-link text-success p-0 m-0" style="text-decoration:none;">🗙</button>
                </form>
            </td>
        </tr>
        {% else %}
        <tr>
            <td colspan="5" class="text-center text-teal-dark">No Pending Staff yet!</td>
        </tr>
        {% endfor %}
    </tbody>
</table>

{% endblock %}
